<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DanusuProject</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #FFFFFF;
      --bg-card: #FFF8C2;
      --bg-footer: #7FA38D;
      --green-primary: #4A7259;
      --green-hover: #3B5C47;
      --text-dark: #2B332E;
      --text-cream: #FFF8C2;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .main-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .login-card {
      background-color: var(--bg-card);
      width: 100%;
      max-width: 760px;
      border-radius: 36px;
      padding: 45px 60px 55px;
      position: relative;
    }

    .back-btn {
      position: absolute;
      top: 32px;
      left: 32px;
      width: 46px;
      height: 46px;
      background-color: var(--green-primary);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .back-btn:hover {
      background-color: var(--green-hover);
      transform: scale(1.05);
    }

    .back-btn svg {
      width: 24px;
      height: 24px;
      fill: var(--bg-card);
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
      margin-top: 10px;
    }

    .login-header h1 {
      font-family: 'Fraunces', serif;
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--green-primary);
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .login-header p {
      font-family: 'Fraunces', serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--green-primary);
      margin-top: 4px;
    }
    
    .login-form {
      max-width: 540px;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      height: 46px;
      background-color: var(--white);
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      color: var(--text-dark);
      outline: none;
      transition: box-shadow 0.2s ease;
    }

    .form-group input:focus {
      box-shadow: 0 0 0 2px var(--green-primary);
    }

   
    .form-actions {
      text-align: center;
      margin-top: 32px;
    }

    .btn-submit {
      background-color: var(--green-primary);
      color: var(--text-cream);
      font-family: 'Fraunces', serif;
      font-size: 1.35rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      padding: 10px 64px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      background-color: var(--green-hover);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .register-prompt {
      margin-top: 12px;
      font-size: 0.95rem;
      color: var(--text-dark);
    }

    .register-prompt a {
      color: var(--text-dark);
      text-decoration: underline;
      font-weight: 500;
    }

    .register-prompt a:hover {
      color: var(--green-primary);
    }


    .footer {
      background-color: var(--bg-footer);
      border-top-left-radius: 42px;
      border-top-right-radius: 42px;
      padding: 40px 60px 50px;
      width: 100%;
    }

    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    .footer-brand {
      font-family: 'Fraunces', serif;
      font-size: 2.35rem;
      font-weight: 800;
      color: var(--text-cream);
      margin-bottom: 24px;
    }

    .footer-columns {
      display: flex;
      justify-content: space-between;
      max-width: 900px;
      padding-left: 45px;
      gap: 20px;
    }

    .footer-col {
      list-style: none;
    }

    .footer-col li {
      margin-bottom: 12px;
    }

    .footer-col a {
      color: var(--text-cream);
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 400;
      transition: opacity 0.2s ease;
    }

    .footer-col a:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    
    @media (max-width: 768px) {
      .login-card {
        padding: 70px 28px 40px;
        border-radius: 28px;
      }

      .back-btn {
        top: 22px;
        left: 22px;
        width: 40px;
        height: 40px;
      }

      .login-header h1 {
        font-size: 2.8rem;
      }

      .footer {
        padding: 35px 30px 40px;
        border-top-left-radius: 30px;
        border-top-right-radius: 30px;
      }

      .footer-columns {
        flex-direction: column;
        padding-left: 0;
        gap: 16px;
      }
    }

    .footer {
      background-color: #7FA38E;
      color: #FFFFFF;
      padding: 32px max(16px, calc((100% - 900px) / 2)) 40px;
      border-radius: 36px 36px 0 0;
    }

    .footer h2 {
      font-family: 'Fraunces', serif;
      font-size: 1.75rem;
      margin-bottom: 16px;
    }

    .footer-content {
      display: grid;
      grid-template-columns: 1fr;
      padding-left: 24px;
    }

    .footer-content p {
      margin-bottom: 6px;
      font-size: 0.82rem;
      color: #FFF6C3;
    }

    @media (max-width: 768px) {
      .footer h2 { font-size: 1.5rem; }
      .footer-content { padding-left: 0; }
      .footer-content p { font-size: 0.72rem; }
    }
  </style>
<link rel="stylesheet" href="site.css">
<script src="site.js" defer></script>
</head>
<body>
<header class="site-navbar">
  <a href="index.html" class="site-brand">DanusuProject</a>
  <nav class="site-nav" aria-label="Navigasi utama"><a href="aboutus.html">ABOUT US</a><a href="index.html">HOME</a></nav>
  <form class="site-search" role="search" action="index.html" method="get">
    <select name="type" aria-label="Kategori pencarian"><option value="all">Semua</option><option value="products">Produk</option><option value="stores">Toko/Akun</option></select>
    <input id="siteSearch" type="search" name="q" placeholder="Cari produk atau toko..." autocomplete="off">
    <button type="submit" aria-label="Cari"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
  </form>
  <a href="profilesaya.html" class="site-profile" aria-label="Akun Anda"><svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/><path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/></svg></a>
  <a href="login.html" class="site-login">LOGIN</a>
</header>

  
  <main class="main-container">
    <div class="login-card">
      
      
      <a href="index.html" class="back-btn" aria-label="Kembali">
        <svg viewBox="0 0 24 24">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </a>

      
      <div class="login-header">
        <h1>Login</h1>
        <p>DanusuProject</p>
      </div>

      
      <form class="login-form" action="#" method="POST">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-submit">Masuk</button>
          <p class="register-prompt">
            Belum punya akun? <a href="akun.html">Buat Akun</a>
          </p>
        </div>
      </form>

    </div>
  </main>

  
  <footer class="footer" id="about">
    <h2>DanusuProject</h2>
    <div class="footer-content">
      <div>
        <p>UNIVERSITAS SUMATERA UTARA</p>
        <p>Jl. Dr. T. Mansur No. 9, Medan, Sumatera Utara</p>
        <p>copyright © 2026 DanusuProject. All rights reserved.</p>
      </div>
    </div>
  </footer>

<script>
  document.addEventListener('click', (event) => {
    const backLink = event.target.closest('a[aria-label="Kembali"]');
    if (!backLink) return;

    event.preventDefault();
    event.stopPropagation();
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = 'index.html';
    }
  }, true);
</script>
</body>
</html>
